<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:42px;margin-bottom:10px;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#888;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:100%;max-width:1000px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:20px;padding:30px;text-decoration:none;color:white;transition:0.3s}
.card:hover{transform:translateY(-8px);border-color:#00ff88;box-shadow:0 10px 30px rgba(0,255,136,0.2)}
.card h2{color:#00ff88;margin-bottom:10px}
.card p{color:#aaa;font-size:14px;margin-bottom:15px}
.btn{background:#00ff88;color:black;padding:10px 22px;border-radius:30px;font-weight:bold;display:inline-block;font-size:14px}
</style>
</head>
